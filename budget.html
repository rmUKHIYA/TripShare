<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budget Planner | TripShare</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="budget.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-wallet"></i>
TripShare Budget
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="explore.html">Explore</a></li>
<li><a href="partner.html">Partners</a></li>
<li><a href="messages.html">Messages</a></li>

</ul>

<button id="darkModeBtn">
🌙
</button>

</nav>

<!-- Dashboard Cards -->

<section class="dashboard">

<div class="dashboard-card">

<h3>Total Budget</h3>

<h2 id="totalBudget">
₹0
</h2>

</div>

<div class="dashboard-card">

<h3>Total Expenses</h3>

<h2 id="totalExpense">
₹0
</h2>

</div>

<div class="dashboard-card">

<h3>Remaining</h3>

<h2 id="remainingAmount">
₹0
</h2>

</div>

</section>

<!-- Budget Calculator -->

<section class="calculator">

<h2>Trip Budget Calculator</h2>

<div class="form-grid">

<input
type="number"
id="hotelCost"
placeholder="Hotel Cost">

<input
type="number"
id="foodCost"
placeholder="Food Cost">

<input
type="number"
id="travelCost"
placeholder="Travel Cost">

<input
type="number"
id="shoppingCost"
placeholder="Shopping Cost">

</div>

<button onclick="calculateBudget()">
Calculate Budget
</button>

</section>

<!-- Expense Tracker -->

<section class="expense-tracker">

<h2>Expense Tracker</h2>

<div class="expense-form">

<input
type="text"
id="expenseName"
placeholder="Expense Name">

<input
type="number"
id="expenseAmount"
placeholder="Amount">

<button onclick="addExpense()">
Add Expense
</button>

</div>

<table>

<thead>

<tr>

<th>Name</th>
<th>Amount</th>

</tr>

</thead>

<tbody id="expenseTable">

</tbody>

</table>

</section>

<!-- Currency Converter -->

<section class="converter">

<h2>Currency Converter</h2>

<div class="converter-box">

<input
type="number"
id="inrAmount"
placeholder="Amount in INR">

<select id="currency">

<option value="0.012">
USD
</option>

<option value="0.011">
EUR
</option>

<option value="1">
INR
</option>

</select>

<button onclick="convertCurrency()">
Convert
</button>

<h3 id="convertedAmount">
Result: 0
</h3>

</div>

</section>

<!-- Expense Analytics -->

<section class="analytics">

<h2>Expense Analytics</h2>

<canvas id="expenseChart"></canvas>

</section>

<script src="budget.js"></script>

</body>

</html>
